name: Validate Nutripetia web
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build Jekyll (no deployment)
        run: bundle exec jekyll build --trace
      - name: Verify stable URLs and unpublished placeholders
        run: python3 scripts/validate_web.py
